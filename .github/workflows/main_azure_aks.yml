name: Deploy Microservice to Azure AKS

on:
  push:
    branches: [ "feature-kubernetes" ] # Activación exclusiva para esta rama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Preparación del entorno
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Construcción del binario (CI)
      - name: Compilar con Maven
        run: mvn clean package -DskipTests
         working-directory: ./microservicio-demo # Ajuste a su ruta real

      # 3. Gestión de Imágenes de Docker
      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v4
        with:
          context: ./microservicio-demo
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ijaramillo-msdemo:latest

      # 4. Conexión con Azure (Nueva sección para K8s)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} # Requiere un Service Principal

      - name: Configurar contexto de AKS
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

      # 5. Despliegue de Manifiestos (CD)
      - name: Desplegar en Kubernetes
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/mysql-pvc.yaml
            k8s/mysql-deploy.yaml
            k8s/microservicio-demo-deployment.yaml
          images: |
            ${{ secrets.DOCKER_USERNAME }}/ijaramillo-msdemo:latest